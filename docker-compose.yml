services:
  db:
    image: postgres:15-alpine
    container_name: backpack_insight_db
    restart: always

    # Podman rootless fix. Docker ignores keep-id where unsupported.
    userns_mode: "keep-id"
    user: "0:0"

    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: .
      dockerfile: RBackend/Dockerfile
    container_name: backpack_insight_backend
    restart: always
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      ROOT_API_ADDR: 0.0.0.0:8000
      ROOT_ENV: ${ROOT_ENV:-development}
      ROOT_PROJECT_ROOT: /app
      ROOT_DB_ENABLED: ${ROOT_DB_ENABLED:-true}
      ROOT_PUBLIC_BASE_URL: ${ROOT_PUBLIC_BASE_URL:-https://backpackinsight.pages.dev}
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Backend code and generated FlatBuffer packs are baked into the image.
    # Runtime has no Python backend, no bind-mounted source, and no JSON compatibility mode.
    deploy:
      resources:
        limits:
          memory: 400M

  web:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Frontend/Web/Dockerfile
    container_name: backpack_insight_web
    restart: always
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5080}:5080"
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    # Local-only frontend container. Server deploy starts only db+backend; Cloudflare Pages owns frontend hosting.

volumes:
  postgres_data:
