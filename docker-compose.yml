# BackpackInsight — единый docker-compose с самоопределением сервер/локал.
#
# Режим определяется env-переменной COMPOSE_PROFILES в .env:
#   * COMPOSE_PROFILES=local   → поднимает db + backend + web (локальная разработка)
#   * COMPOSE_PROFILES=        → поднимает только db + backend (сервер, web на Cloudflare Pages)
#
# Это стандартная docker compose возможность (не требует --profile флага).
# Скрипт scripts/run_docker.py может автоопределять режим (BACKPACK_DOCKER_MODE=auto).
#
# БД: по умолчанию SQLite (DATABASE_URL=sqlite:./backpack_insight.db в .env),
# что позволяет local-разработку вообще без сервиса db. Для Postgres —
# раскомментируйте DATABASE_URL с postgres://... или задайте POSTGRES_* vars.

services:
  db:
    image: postgres:15-alpine
    container_name: backpack_insight_db
    restart: always
    # Podman rootless fix. Docker ignores keep-id where unsupported.
    userns_mode: "keep-id"
    user: "0:0"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 300M
    # В SQLite-режиме сервис db не нужен — backend использует файл.
    # Чтобы не поднимать Postgres впустую, задайте COMPOSE_PROFILES=local-sqlite
    # и используйте DATABASE_URL=sqlite:./backpack_insight.db в .env.

  backend:
    build:
      context: .
      dockerfile: RBackend/Dockerfile
    container_name: backpack_insight_backend
    restart: always
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - .env
    environment:
      ROOT_API_ADDR: 0.0.0.0:8000
      ROOT_ENV: ${ROOT_ENV:-development}
      ROOT_PROJECT_ROOT: /app
      ROOT_DB_ENABLED: ${ROOT_DB_ENABLED:-true}
      ROOT_PUBLIC_BASE_URL: ${ROOT_PUBLIC_BASE_URL:-https://backpackinsight.pages.dev}
      # Postgres connection (если DATABASE_URL не задан как sqlite:...)
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 400M

  web:
    profiles: ["local"]
    build:
      context: .
      dockerfile: Frontend/Web/Dockerfile
    container_name: backpack_insight_web
    restart: always
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5080}:5080"
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
