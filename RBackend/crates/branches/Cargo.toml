[package]
name = "branches"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "branches"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8", features = ["islands", "islands-router"] }
leptos_meta = "0.8"
serde = { version = "1", features = ["derive"] }
# Островной редактор читает и пишет JSON билда в браузере.
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["History", "Location", "HtmlAnchorElement", "HtmlElement", "DomTokenList", "CssStyleDeclaration", "Url", "UrlSearchParams", "Document", "NodeList", "HtmlLinkElement", "Response", "Window", "Element", "DomRect", "Event", "EventTarget", "PointerEvent", "MouseEvent", "KeyboardEvent", "Node", "Storage"], optional = true }
any_spawner = { version = "0.3", features = ["tokio"], optional = true }
api = { path = "../api", optional = true }
rbackend_core = { path = "../core", optional = true }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", features = ["islands-router"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"], optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "dep:any_spawner",
    "dep:api",
    "dep:rbackend_core",
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

# wasm-bindgen output contains unsafe glue, so `forbid` from the workspace
# cannot apply here; `deny` keeps hand-written code unsafe-free.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# `#[component]`/`#[island]` take props by value by design.
needless_pass_by_value = "allow"
