# Правила картинок предметов для `art` (см. docs/RBackend/crates/art/rules.toml.md).
#
# Оригиналы игры (ContentKit, экспорт предметов) не меняются никогда.
# Всё, чем имя файла в архиве расходится с предметом, записано здесь,
# и эти же правила применяются к каждой следующей версии архива.
# Ключи — `id` предмета из экспорта (не `name`): `id` уникален, `name` повторяется у этапов ограблений.

[sources]
# Где искать картинки внутри архива. Папка героя в имя не входит: предметы переезжают между папками.
roots = ["Items", "ui/Icons/Boons"]
# Файлы-состояния: `Antivenom Empty`, `Medium Bag open`, `Toolbox Closed`.
states = ["Empty", "open", "Closed"]
# Клетка на выходе: 60 px — маленькая форма островка, 120 px — средняя и подробная.
cell_sizes = [60, 120]
# Допуск по пропорциям: рамка сумок (255×375 у формы 2×3) и сдвиги на пару px растягиваются.
aspect_tolerance = 0.08
# Если картинка лежит поперёк формы (весло 240×120 у формы 1×2) — поворот по часовой.
default_rotate = 90

[alias]
# Файл в архиве назван иначе, чем предмет.
