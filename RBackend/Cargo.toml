[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/api",
    "crates/builder",
    "crates/pack",
    "crates/middleware",
    "crates/db",
    "crates/branches",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/RedOrkGreenRox/Backpackinsight"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Smallest WASM for the islands bundle (cargo-leptos `lib-profile-release`).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[[workspace.metadata.leptos]]
name = "backpack-insight"
bin-package = "branches"
lib-package = "branches"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/branches/style/site.scss"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
