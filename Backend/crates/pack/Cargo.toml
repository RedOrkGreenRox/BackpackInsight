[package]
name = "pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flatbuffers = "25"
serde = { version = "1", features = ["derive"] }

# Generated FlatBuffers accessors contain unsafe internally. Keep this isolated
# in pack instead of disabling unsafe for the whole workspace.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
