[package]
name = "art"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Item art pipeline: original ContentKit + rules -> normalized avif/webp + manifest"

[dependencies]
backend_core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png"] }
ravif = "0.13"
webp = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[lints]
workspace = true
