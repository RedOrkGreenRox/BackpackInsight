<title>Созвездие документации BackpackInsight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Тёмная карта звёздного неба: граф на весь экран, поверх него плавающие стеклянные панели. Одна тема намеренно. */
:root {
  color-scheme: dark;
  --sky: #070b17; --sky-2: #0e1530; --glass: rgba(14, 21, 44, .78); --line: rgba(160, 180, 255, .16);
  --ink: #e6e9f5; --ink-dim: #9aa3c2; --ink-faint: #5d6688; --focus: #ffd98a;
  --l-rust: #ff8f5a; --l-ts: #4ea8ff; --l-scss: #ff6fc0; --l-py: #ffd84d; --l-data: #6fe0a0; --l-doc: #eef0fa;
  --bad: #ff4d5e; --k-both: #d8e0ff; --k-link: #8f9cd6; --k-import: #ffb347;
  --z-rust: #e0573a; --z-ts: #2fc4d6; --z-py: #c9a227; --z-tools: #3fae6a; --z-meta: #a58bff;
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
html, body { height: 100%; }
body { background: radial-gradient(120% 90% at 30% 20%, var(--sky-2), var(--sky) 60%); color: var(--ink);
  font: 14px/1.5 var(--f-body); overflow: hidden; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky.dragging { cursor: grabbing; }
.card { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#hud { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: min(340px, calc(100vw - 32px));
  padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font: 700 17px/1.2 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.stats { color: var(--ink-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#search { width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(0, 0, 0, .3); color: var(--ink); font: 14px var(--f-body); }
#search:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
#hits { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#hits button { width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: 8px; background: none;
  color: var(--ink); font: 13px var(--f-body); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
#hits button:hover, #hits button:focus-visible { background: rgba(255, 255, 255, .07); outline: none; }
#hits small { color: var(--ink-faint); font: 11px var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.legend b { width: 100%; font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-faint); }
.chip.ring i { background: none; box-shadow: inset 0 0 0 2.5px var(--c), 0 0 8px var(--c); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: none; color: var(--ink); font: 12px var(--f-body); }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.chip[aria-pressed="false"] { color: var(--ink-faint); }
.chip[aria-pressed="false"] i { background: none; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip:focus-visible, .x:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hint { color: var(--ink-faint); font-size: 12px; margin: 0; }
#filters summary { cursor: pointer; color: var(--ink-dim); font-size: 12.5px; margin-bottom: 6px; }
#filters summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#doc { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(460px, calc(100vw - 32px)); display: flex; flex-direction: column; overflow: hidden; }
#doc header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
#doc header div { flex: 1; min-width: 0; }
#doc .zone { font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--c); }
#doc h2 { margin: 4px 0 2px; font: 600 16px/1.3 var(--f-display); text-wrap: balance; }
#doc .path { font: 11.5px var(--f-mono); color: var(--ink-dim); word-break: break-all; }
.x { border: 1px solid var(--line); background: none; color: var(--ink); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; }
.links { padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--ink-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#md { padding: 6px 18px 24px; overflow-y: auto; min-width: 0; font-size: 13.5px; }
#md h1, #md h2, #md h3, #md h4 { font-family: var(--f-display); font-weight: 500; line-height: 1.3; margin: 18px 0 6px; }
#md h1 { font-size: 15px; } #md h2 { font-size: 14px; color: var(--focus); } #md h3, #md h4 { font-size: 13px; }
#md code { font: 12px var(--f-mono); background: rgba(255, 255, 255, .07); padding: 1px 5px; border-radius: 5px; }
#md pre { background: rgba(0, 0, 0, .35); padding: 10px 12px; border-radius: 10px; overflow-x: auto; }
#md pre code { background: none; padding: 0; }
#md a { color: var(--l-ts); text-decoration: none; border-bottom: 1px solid rgba(90, 184, 240, .35); }
#md a[data-doc] { color: var(--focus); border-bottom-color: rgba(255, 217, 138, .35); cursor: pointer; }
#md blockquote { margin: 10px 0; padding: 4px 12px; border-left: 2px solid var(--line); color: var(--ink-dim); }
#md .tbl { overflow-x: auto; } #md table { border-collapse: collapse; font-size: 12.5px; }
#md td, #md th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; text-align: left; }
#md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
#md ul, #md ol { padding-left: 20px; }
@media (max-width: 760px) {
  #hud { padding: 12px 14px; gap: 8px; }
  h1 { font-size: 15px; }
  .chip { padding: 3px 8px; font-size: 11px; }
  #hits { max-height: 22vh; }
  #doc { top: auto; left: 16px; right: 16px; width: auto; height: 58vh; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<canvas id="sky" aria-label="Граф документов: точки — документы, линии — ссылки и импорты, круги — кластеры папок"></canvas>
<section id="hud" class="card">
  <h1>Созвездие документации</h1>
  <div class="stats" id="stats"></div>
  <input id="search" type="search" placeholder="Найти документ или файл…" autocomplete="off" aria-label="Поиск документа">
  <ul id="hits" hidden></ul>
  <details id="filters" open><summary>Фильтры и легенда</summary><div class="legend" id="legend"></div></details>
  <p class="hint">Колесо или щипок — масштаб, перетаскивание — сдвиг. Круги — папки, тяжёлые ближе к центру; красный кластер — проблемы. Клик по звезде открывает документ.</p>
</section>
<aside id="doc" class="card" hidden aria-live="polite">
  <header><div><div class="zone" id="doc-zone"></div><h2 id="doc-title"></h2><div class="path" id="doc-path"></div></div>
    <button class="x" id="doc-close" aria-label="Закрыть документ">×</button></header>
  <div class="links" id="doc-links"></div>
  <article id="md"></article>
</aside>
